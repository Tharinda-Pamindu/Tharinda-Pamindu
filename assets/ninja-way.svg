<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="476" viewBox="0 0 1280 476" role="img" aria-labelledby="title desc">
<title id="title">My ninja way — learn, build and improve</title><desc id="desc">Full-stack development, AI/ML exploration and competitive programming.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172032"/><stop offset="1" stop-color="#0c111d"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#ff963b" stop-opacity=".65"/><stop offset=".5" stop-color="#29344b"/><stop offset="1" stop-color="#67c8ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#ff963b" stop-opacity=".18"/><stop offset="1" stop-color="#ff963b" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1" fill="#8291b0" opacity=".12"/></pattern>
<style>
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 7s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.spin,.float,.pulse{animation:none}}
</style></defs>
<rect x="1" y="1" width="1278" height="474" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="474" rx="24" fill="url(#dots)"/>
<text x="52" y="56" fill="#ff963b" font-size="14" font-weight="600" font-family="Consolas,monospace">01 / MY NINJA WAY</text><text x="52" y="103" fill="#eef2fa" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Keep learning. Keep building.</text><text x="52" y="138" fill="#a1acc2" font-size="20" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Turning curiosity into useful software, one project at a time.</text><g class="float"><rect x="52" y="185" width="400" height="252" rx="16" fill="#141d2e" stroke="#2b354b"/><circle cx="76" cy="211" r="5" fill="#ff7c78"/><circle cx="94" cy="211" r="5" fill="#ffca68"/><circle cx="112" cy="211" r="5" fill="#68deb2"/><text x="78" y="260" fill="#67c8ff" font-size="14" font-weight="600" font-family="Consolas,monospace">class Developer {</text><text x="96" y="297" fill="#eef2fa" font-size="14" font-weight="600" font-family="Consolas,monospace">mindset = &quot;keep growing&quot;;</text><text x="96" y="334" fill="#eef2fa" font-size="14" font-weight="600" font-family="Consolas,monospace">focus = &quot;build with purpose&quot;;</text><text x="96" y="371" fill="#ff963b" font-size="14" font-weight="600" font-family="Consolas,monospace">learn(); build(); repeat();</text><text x="78" y="407" fill="#67c8ff" font-size="14" font-weight="600" font-family="Consolas,monospace">}</text></g><rect x="500" y="198" width="728" height="74" rx="16" fill="#141d2e" stroke="#2b354b"/><text x="520" y="241" fill="#ff963b" font-size="14" font-weight="600" font-family="Consolas,monospace">01</text><text x="568" y="226" fill="#eef2fa" font-size="22" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Full-stack development</text><text x="568" y="253" fill="#a1acc2" font-size="18" font-weight="400" font-family="Segoe UI,Arial,sans-serif">React interfaces, Java services, and connected data.</text><rect x="500" y="286" width="728" height="74" rx="16" fill="#141d2e" stroke="#2b354b"/><text x="520" y="329" fill="#67c8ff" font-size="14" font-weight="600" font-family="Consolas,monospace">02</text><text x="568" y="314" fill="#eef2fa" font-size="22" font-weight="650" font-family="Segoe UI,Arial,sans-serif">AI / ML exploration</text><text x="568" y="341" fill="#a1acc2" font-size="18" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Learning through computer vision and practical projects.</text><rect x="500" y="374" width="728" height="74" rx="16" fill="#141d2e" stroke="#2b354b"/><text x="520" y="417" fill="#68deb2" font-size="14" font-weight="600" font-family="Consolas,monospace">03</text><text x="568" y="402" fill="#eef2fa" font-size="22" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Problem solving</text><text x="568" y="429" fill="#a1acc2" font-size="18" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Competitive programming and continuous improvement.</text>
<rect x="1" y="1" width="1278" height="474" rx="24" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>